"$schema" = 'https://starship.rs/config-schema.json'

scan_timeout = 100

format = '''┌─\($os$hostname $username\)$directory$battery$cmd_duration(
│ (\($git_branch(|$git_status)\))$all)
└$character'''

add_newline=false

[battery]
format = '\([$symbol $percentage]($style)\)'
full_symbol = '🔋'
charging_symbol = '⚡️'
discharging_symbol = '󰂃'

[[battery.display]]
threshold = 100
style = 'green'

[[battery.display]]
threshold = 80
style = 'blue'

[[battery.display]]
threshold = 60
style = 'cyan'

[[battery.display]]
threshold = 40
style = 'yellow'

[[battery.display]]
threshold = 20
style = 'red'
discharging_symbol = '💀'

[line_break]
disabled = true

[aws]
symbol = ""
format = '\([$symbol($profile)(\($region\))(\($duration\))]($style)\)'

[bun]
format = '\([$symbol($version)]($style)\)'

[buf]
symbol = ""

[c]
symbol = ""
format = '\([$symbol($version(-$name))]($style)\)'

[cmake]
format = '\([$symbol($version)]($style)\)'

[cmd_duration]
format = '\([⏱ $duration]($style)\)'

[cobol]
format = '\([$symbol($version)]($style)\)'

[conda]
symbol = ""
format = '\([$symbol$environment]($style)\)'

[crystal]
