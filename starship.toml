format = '\([$symbol$branch]($style)\)'

[gcloud]
format = '\([$symbol$account(@$domain)(\($region\))]($style)\)'

[git_branch]
symbol = ""
format = '''[$symbol $branch]($style)'''

[git_status]
format = '[($ahead_behind[|](first))$all_status]($style)'
ahead = "⇡$count"
behind = "⇣$count"
diverged = "⇕⇡$ahead_count⇣$behind_count"
conflicted = "!=$count"
stashed = "≡$count"
deleted = "✘$count"
renamed = "»$count"
modified = "~$count"
staged = "+$count"
untracked = "?$count"

[golang]
symbol = ""
format = '\([$symbol($version)]($style)\)'

[gradle]
format = '\([$symbol($version)]($style)\)'

[guix_shell]
